<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ejfunnysocks</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg,#5b21b6,#0e7490); font-family: Arial, sans-serif; color: white; }
    main { width: min(92vw, 620px); text-align: center; padding: 48px 24px; }
    h1 { font-size: clamp(2.8rem, 10vw, 5.5rem); margin: 0 0 10px; }
    p { font-size: 1.2rem; margin: 0 0 34px; opacity: .9; }
    .buttons { display: grid; gap: 16px; }
    a { display: block; padding: 22px 26px; border-radius: 16px; background: white; color: #312e81; text-decoration: none; font-size: 1.3rem; font-weight: 800; box-shadow: 0 10px 24px #0004; transition: transform .18s, box-shadow .18s; }
    a:hover { transform: translateY(-4px); box-shadow: 0 16px 30px #0005; }
    .contact { margin-top: 28px; font-size: 1rem; font-weight: 700; }
    .small { margin-top: 12px; font-size: .95rem; opacity: .9; }
  </style>
</head>
<body>
  <main>
    <h1>ejfunnysocks</h1>
    <p>Pick something to open!</p>
    <div class="buttons">
      <a href="https://ejfunnysocks.github.io/my-web-games/">🎮 Play My Web Games</a>
      <a href="https://github.com/ejfunnysocks">🐙 My GitHub</a>
    </div>
    <div class="contact">Bug reports: ejfunnysocks@gmail.com</div>
    <div class="small">More stuff coming soon.</div>
  </main>
</body>
</html>
